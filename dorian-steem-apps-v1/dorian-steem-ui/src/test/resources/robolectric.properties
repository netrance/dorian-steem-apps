# Robolectric defaults to the module's targetSdk, which is 36. Android SDK 36 and 37 require
# Java 21, while this project is on the Java 17 toolchain, so the sandbox fails to start with
# "Android SDK 36 requires Java 21 (have Java 17)".
#
# SDK 35 is the newest Robolectric SDK that still runs on Java 17. Raise this to 36 only
# together with the Java toolchain.
sdk=35
